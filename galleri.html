<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          background: '#f5f0e6',
          'background-paper': '#faf7f2',
          foreground: '#1a1a1a',
          'foreground-muted': '#4a4a4a',
          border: '#d4c9b8',
          'border-dark': '#8b7355',
          accent: '#d97706',
          'accent-light': '#f59e0b',
          'accent-dark': '#b45309',
        },
        fontFamily: {
          heading: ['"Playfair Display"', 'Georgia', 'serif'],
          body: ['Lora', 'Georgia', 'serif'],
        },
      },
    },
  };
</script>
<style>
  body {
    font-family: 'Lora', Georgia, serif;
    line-height: 1.7;
    background: #f5f0e6;
    color: #1a1a1a;
    position: relative;
  }
  body::before {
    content: "";
    pointer-events: none;
    opacity: 0.03;
    z-index: 9999;
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  h1, h2, h3, h4, h5, h6 {
    font-family: 'Playfair Display', Georgia, serif;
    letter-spacing: -0.02em;
    font-weight: 700;
    line-height: 1.2;
  }
  a:focus-visible, button:focus-visible {
    outline: 2px solid #d97706;
    outline-offset: 2px;
  }

  .photo {
    position: relative;
    overflow: hidden;
    border-radius: 2px;
    background: #d4c9b8;
    aspect-ratio: 4 / 5;
  }
  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .photo:hover img { transform: scale(1.04); }
  @media (prefers-reduced-motion: reduce) {
    .photo img { transition: none; }
    .photo:hover img { transform: none; }
  }
  .photo-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.65), rgba(0,0,0,0) 55%);
    pointer-events: none;
  }
  .photo-caption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 0.75rem;
    color: #faf7f2;
  }

  .video-item {
    position: relative;
    background: #1a1a1a;
    border-radius: 2px;
    overflow: hidden;
    aspect-ratio: 4 / 5;
  }
  .video-item video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  /* Usynlig knap over hele feltet: åbner forstørret visning */
  .tile-open {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: zoom-in;
  }
  .tile-open:focus-visible { outline: 2px solid #d97706; outline-offset: -4px; }

  .play-badge {
    position: absolute;
    top: 50%; left: 50%;
    width: 3.25rem; height: 3.25rem;
    margin: -1.625rem 0 0 -1.625rem;
    display: grid;
    place-items: center;
    border-radius: 9999px;
    background: rgba(26, 22, 18, 0.55);
    border: 1px solid rgba(250, 247, 242, 0.55);
    color: #faf7f2;
    pointer-events: none;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .video-item:hover .play-badge { transform: scale(1.08); }

  /* Forstørret visning */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4.5rem 1rem 2rem;
    background: rgba(18, 13, 9, 0.82);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    opacity: 0;
    transition: opacity 0.22s ease;
    cursor: zoom-out;
    touch-action: pan-y pinch-zoom;
  }
  .lightbox[hidden] { display: none; }
  .lightbox.is-open { opacity: 1; }
  .lightbox-figure {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
    transform: scale(0.97);
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    cursor: default;
  }
  .lightbox.is-open .lightbox-figure { transform: scale(1); }
  .lightbox-figure img,
  .lightbox-figure video {
    display: block;
    width: auto;
    height: auto;
    max-width: min(calc(100vw - 9rem), 1600px);
    max-height: calc(100vh - 9rem);
    border-radius: 2px;
    background: #1a1a1a;
    box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.6), 0 8px 24px -8px rgba(0, 0, 0, 0.4);
  }
  @supports (height: 100dvh) {
    .lightbox-figure img,
    .lightbox-figure video { max-height: calc(100dvh - 9rem); }
  }
  .lightbox-frame {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }
  /* Kun selve pilen er synlig; knappens flade er usynlig og giver blot et stort nok trykområde */
  .lightbox-nav {
    flex: none;
    width: 2.5rem; height: 3.5rem;
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: 0.5rem;
    background: transparent;
    color: #faf7f2;
    opacity: 0.7;
    cursor: pointer;
    transition: opacity 0.2s ease;
  }
  .lightbox-nav svg {
    filter: drop-shadow(0 0 2px rgba(0, 0, 0, 0.65)) drop-shadow(0 1px 4px rgba(0, 0, 0, 0.4));
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .lightbox-nav:hover { opacity: 1; }
  .lightbox-prev:hover svg { transform: translateX(-2px); }
  .lightbox-next:hover svg { transform: translateX(2px); }
  .lightbox-nav:active { opacity: 0.5; }
  .lightbox-nav:focus-visible { outline: 2px solid #f59e0b; outline-offset: 2px; opacity: 1; }
  .lightbox-nav[disabled] { visibility: hidden; }
  @keyframes lightbox-in-next { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
  @keyframes lightbox-in-prev { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
  .lightbox-figure.slide-next { animation: lightbox-in-next 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
  .lightbox-figure.slide-prev { animation: lightbox-in-prev 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
  /* Smalle skærme: pilene ligger inde over billedets kanter i stedet for ved siden af */
  @media (max-width: 699px) {
    .lightbox-figure img,
    .lightbox-figure video { max-width: min(94vw, 1600px); }
    .lightbox-nav {
      position: absolute;
      top: 50%;
      margin-top: -1.75rem;
    }
    .lightbox-prev { left: 0; }
    .lightbox-next { right: 0; }
  }
  .lightbox-caption {
    max-width: min(94vw, 40rem);
    text-align: center;
    font-style: italic;
    font-size: 0.875rem;
    line-height: 1.5;
    color: rgba(250, 247, 242, 0.9);
  }
  .lightbox-close {
    position: absolute;
    top: max(1rem, env(safe-area-inset-top));
    right: max(1rem, env(safe-area-inset-right));
    width: 2.75rem; height: 2.75rem;
    display: grid;
    place-items: center;
    border-radius: 9999px;
    border: 1px solid rgba(250, 247, 242, 0.35);
    background: rgba(250, 247, 242, 0.1);
    color: #faf7f2;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .lightbox-close:hover { background: rgba(250, 247, 242, 0.22); }
  .lightbox-close:active { transform: scale(0.94); }
  .lightbox-close:focus-visible { outline: 2px solid #f59e0b; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    .lightbox, .lightbox-figure, .lightbox-close, .lightbox-nav, .lightbox-nav svg, .play-badge { transition: none; }
    .lightbox-prev:hover svg, .lightbox-next:hover svg { transform: none; }
    .lightbox-figure { transform: none; }
    .lightbox-figure.slide-next, .lightbox-figure.slide-prev { animation: none; }
    .video-item:hover .play-badge { transform: none; }
  }

  .reveal {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .reveal.is-visible { opacity: 1; transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
  }
</style>
</head>

<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Forstørret visning" hidden>
  <button type="button" class="lightbox-close" aria-label="Luk">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
  </button>
  <figure class="lightbox-figure">
    <div class="lightbox-frame">
      <button type="button" class="lightbox-nav lightbox-prev" aria-label="Forrige">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div id="lightbox-media"></div>
      <button type="button" class="lightbox-nav lightbox-next" aria-label="Næste">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
    <figcaption id="lightbox-caption" class="lightbox-caption" hidden></figcaption>
  </figure>
</div>

<script>
  // Billed-/videoliste: tilføj ét objekt pr. fil, når nye lægges i galleri/-mappen.
  // Sæt type: "video" for .mp4/.mov/.webm-filer, ellers behandles posten som billede.
  const photos = [
    { src: "galleri/01.jpg", alt: "Ophedet diskussion under vedtægtsforsamlingen", caption: "Ophedet diskussion under vedtægtsforsamlingen" },
    { src: "galleri/02.jpg", alt: "Formanden præsenterer de underskrevne vedtægter", caption: "Formanden præsenterer de underskrevne vedtægter" },
    { src: "galleri/03.jpg", alt: "Ingen nazister i vores gader demonstration", caption: "Ingen nazister i vores gader demonstration" },
    { src: "galleri/04.jpg", alt: "Middag på Rio Bravo", caption: "Middag på Rio Bravo" },
    { src: "galleri/05.mov", type: "video" },
    { src: "galleri/06.jpg", alt: "Middag på Frederik VI", caption: "Middag på Frederik VI" },
    { src: "galleri/07.jpg", alt: "Dragbanko", caption: "Dragbanko" },
    { src: "galleri/08.jpg", alt: "Dragbanko", caption: "Dragbanko" },
    { src: "galleri/09.mov", type: "video" },
    { src: "galleri/10.jpg", alt: "Adam på alkoholfri druk i Malmö", caption: "Adam på alkoholfri druk i Malmö" },
    { src: "galleri/11.jpg", alt: "Drengene drikker dram", caption: "Drengene drikker dram", position: "25%" },
    { src: "galleri/12.jpg", alt: "Julius vasker overskægget", caption: "Julius vasker overskægget" },
    { src: "galleri/13.jpg", alt: "Nabobordet misforstod \"bogklub\" for \"bögklub\"", caption: "Nabobordet misforstod \"bogklub\" for \"bögklub\"" },
  ];

  // Nyeste (højeste filnummer) først.
  const numberOf = (p) => {
    const match = p.src.match(/(\d+)(?=\.\w+$)/);
    return match ? parseInt(match[0], 10) : -1;
  };
  photos.sort((a, b) => numberOf(b) - numberOf(a));

  const grid = document.getElementById('photo-grid');
  const empty = document.getElementById('empty-state');

  // Forstørret visning: billedet/videoen vises i sine egne proportioner (uden beskæring),
  // og baggrunden bag bliver mørkere med slør. Man kan bladre mellem alle billeder og videoer
  // med pilene, piletasterne eller ved at swipe. Luk med Esc, klik udenfor eller krydset.
  const lightbox = document.getElementById('lightbox');
  const lightboxFigure = lightbox.querySelector('.lightbox-figure');
  const lightboxMedia = document.getElementById('lightbox-media');
  const lightboxCaption = document.getElementById('lightbox-caption');
  const lightboxClose = lightbox.querySelector('.lightbox-close');
  const prevBtn = lightbox.querySelector('.lightbox-prev');
  const nextBtn = lightbox.querySelector('.lightbox-next');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const tiles = new Map(); // post -> feltets knap, så fokus kan vende tilbage til det viste billede
  let current = -1;
  let closeTimer = null;

  const releaseVideo = (v) => { v.pause(); v.removeAttribute('src'); v.load(); };
  const preload = (i) => { const p = photos[i]; if (p && p.type !== 'video') new Image().src = p.src; };

  // Viser post nr. index. dir: 1 = næste, -1 = forrige, 0 = første visning.
  const showAt = (index, dir = 0, autoplay = false) => {
    current = index;
    const p = photos[index];
    lightboxMedia.querySelectorAll('video').forEach(releaseVideo);
    lightboxMedia.replaceChildren();

    if (p.type === 'video') {
      const video = document.createElement('video');
      video.src = autoplay ? p.src : `${p.src}#t=0.1`; // uden autoplay vises et billede fra videoen
      video.controls = true;
      video.playsInline = true;
      video.preload = 'metadata';
      lightboxMedia.appendChild(video);
      if (autoplay) video.play()?.catch(() => {});
    } else {
      const img = document.createElement('img');
      img.src = p.src;
      img.alt = p.alt || '';
      lightboxMedia.appendChild(img);
    }

    lightboxCaption.textContent = p.caption || '';
    lightboxCaption.hidden = !p.caption;
    prevBtn.disabled = index === 0;
    nextBtn.disabled = index === photos.length - 1;
    if (document.activeElement === prevBtn && prevBtn.disabled) lightboxClose.focus();
    if (document.activeElement === nextBtn && nextBtn.disabled) lightboxClose.focus();

    lightboxFigure.classList.remove('slide-next', 'slide-prev');
    if (dir && !reducedMotion.matches) {
      void lightboxFigure.offsetWidth; // genstart animationen
      lightboxFigure.classList.add(dir > 0 ? 'slide-next' : 'slide-prev');
    }
    preload(index + 1);
    preload(index - 1);
  };

  const go = (dir) => {
    const next = current + dir;
    if (next < 0 || next >= photos.length) return;
    showAt(next, dir);
  };

  const openLightbox = (p) => {
    clearTimeout(closeTimer);
    showAt(photos.indexOf(p), 0, p.type === 'video');
    lightbox.hidden = false;
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(() => lightbox.classList.add('is-open'));
    lightboxClose.focus();
  };

  const closeLightbox = () => {
    if (lightbox.hidden) return;
    lightboxMedia.querySelectorAll('video').forEach((v) => v.pause());
    lightbox.classList.remove('is-open');
    const finish = () => {
      lightbox.hidden = true;
      lightboxMedia.querySelectorAll('video').forEach(releaseVideo);
      lightboxMedia.replaceChildren();
      document.body.style.overflow = '';
      tiles.get(photos[current])?.focus();
    };
    if (reducedMotion.matches) finish();
    else closeTimer = setTimeout(finish, 240);
  };

  prevBtn.addEventListener('click', () => go(-1));
  nextBtn.addEventListener('click', () => go(1));
  lightbox.addEventListener('click', (e) => {
    if (!e.target.closest('#lightbox-media, #lightbox-caption, .lightbox-nav')) closeLightbox();
  });

  document.addEventListener('keydown', (e) => {
    if (lightbox.hidden) return;
    if (e.key === 'Escape') {
      closeLightbox();
    } else if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && document.activeElement?.tagName !== 'VIDEO') {
      // Har videoen fokus, bruger piletasterne den selv til at spole.
      e.preventDefault();
      go(e.key === 'ArrowRight' ? 1 : -1);
    } else if (e.key === 'Tab') {
      // Hold tastaturfokus inde i visningen (krydset, pilene og evt. videokontroller).
      const focusable = [...lightbox.querySelectorAll('button:not([disabled]), video[controls]')];
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  // Swipe: træk til venstre = næste, til højre = forrige.
  let touchStart = null;
  lightbox.addEventListener('touchstart', (e) => {
    touchStart = null;
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    const video = e.target.closest('video');
    if (video && t.clientY > video.getBoundingClientRect().bottom - 64) return; // videoens tidslinje
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  lightbox.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
  }, { passive: true });

  if (photos.length === 0) {
    grid.classList.add('hidden');
    empty.classList.remove('hidden');
  } else {
    // Klik på et felt åbner den forstørrede visning (se openLightbox nedenfor).
    photos.forEach((p) => {
      const fig = document.createElement('figure');
      const open = document.createElement('button');
      open.type = 'button';
      open.className = 'tile-open';
      open.addEventListener('click', () => openLightbox(p));
      tiles.set(p, open);

      if (p.type === 'video') {
        fig.className = 'reveal';
        const box = document.createElement('div');
        box.className = 'video-item';

        const video = document.createElement('video');
        video.src = `${p.src}#t=0.1`; // viser et billede fra videoen som forsidebillede
        video.muted = true;
        video.playsInline = true;
        video.preload = 'metadata';
        video.tabIndex = -1;
        video.setAttribute('aria-hidden', 'true');

        const badge = document.createElement('span');
        badge.className = 'play-badge';
        badge.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a.6.6 0 0 0 .92.5l10.2-6.5a.6.6 0 0 0 0-1L8.92 5a.6.6 0 0 0-.92.5Z"/></svg>';

        open.setAttribute('aria-label', 'Afspil video');
        box.append(video, badge, open);
        fig.appendChild(box);
      } else {
        fig.className = 'photo reveal';
        const img = document.createElement('img');
        img.src = p.src;
        img.alt = p.alt || '';
        img.loading = 'lazy';
        if (p.position) img.style.objectPosition = p.position;

        const shade = document.createElement('div');
        shade.className = 'photo-overlay';

        fig.append(img, shade);
        if (p.caption) {
          const cap = document.createElement('figcaption');
          cap.className = 'photo-caption text-xs uppercase tracking-widest';
          cap.textContent = p.caption;
          fig.appendChild(cap);
        }
        open.setAttribute('aria-label', `Forstør billede: ${p.caption || p.alt || ''}`.trim());
        fig.appendChild(open);
      }
      grid.appendChild(fig);
    });

    const items = document.querySelectorAll('.reveal');
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1, rootMargin: '0px 0px 300px 0px' });
      items.forEach((el) => io.observe(el));
    } else {
      items.forEach((el) => el.classList.add('is-visible'));
    }
  }
</script>
</body>
</html>
