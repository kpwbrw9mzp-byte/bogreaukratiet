<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bogreaukratiet — Statistik</title>
<meta name="description" content="Statistik og grafer for Bogreaukratiets læsning" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          background: '#f5f0e6',
          'background-paper': '#faf7f2',
          foreground: '#1a1a1a',
          'foreground-muted': '#4a4a4a',
          border: '#d4c9b8',
          'border-dark': '#8b7355',
          accent: '#d97706',
          'accent-light': '#f59e0b',
          'accent-dark': '#b45309',
        },
        fontFamily: {
          heading: ['"Playfair Display"', 'Georgia', 'serif'],
          body: ['Lora', 'Georgia', 'serif'],
        },
      },
    },
  };
</script>
<style>
  body {
    font-family: 'Lora', Georgia, serif;
    line-height: 1.7;
    background: #f5f0e6;
    color: #1a1a1a;
    position: relative;
  }
  body::before {
    content: "";
    pointer-events: none;
    opacity: 0.03;
    z-index: 9999;
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  h1, h2, h3, h4, h5, h6 {
    font-family: 'Playfair Display', Georgia, serif;
    letter-spacing: -0.02em;
    font-weight: 700;
    line-height: 1.2;
  }
  a:focus-visible, button:focus-visible {
    outline: 2px solid #d97706;
    outline-offset: 2px;
  }

  #ranking summary { list-style: none; }
  #ranking summary::-webkit-details-marker { display: none; }
  #ranking summary:hover .book-title { color: #b45309; }
  #ranking summary:active { opacity: 0.7; }
  .score-num, .stat-num { font-variant-numeric: lining-nums; }
  .score-num svg { transform: translateY(1px); }
  #ranking .chev { position: relative; top: 1px; transition: transform 0.3s cubic-bezier(0.34, 1.4, 0.64, 1); }
  #ranking details[open] .chev { transform: rotate(180deg); }
  @media (prefers-reduced-motion: reduce) {
    #ranking .chev { transition: none; }
  }

  .reveal {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .reveal.is-visible { opacity: 1; transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
  }
</style>
</head>
<body class="min-h-screen bg-background">

<header class="w-full border-b border-border-dark">
  <div class="border-b border-border py-2 px-4 text-center">
    <span class="text-xs uppercase tracking-widest text-foreground-muted">Næste møde: 17. Oktober 2026</span>
  </div>
  <div class="py-6 px-4 text-center">
    <a class="inline-flex flex-col items-center gap-2 group" href="arkiv.html">
      <svg width="52" height="52" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg" class="transition-transform duration-300 ease-out group-hover:-translate-y-0.5">
        <circle cx="26" cy="26" r="25" stroke="#8b7355" stroke-width="1"/>
        <circle cx="26" cy="26" r="21" stroke="#d4c9b8" stroke-width="1"/>
        <path d="M26 17c-2.4-1.8-5.6-2.4-9-1.6v15.4c3.4-.8 6.6-.2 9 1.6 2.4-1.8 5.6-2.4 9-1.6V15.4c-3.4-.8-6.6-.2-9 1.6Z" stroke="#d97706" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="M26 17v15.4" stroke="#d97706" stroke-width="1.3"/>
      </svg>
      <span class="font-heading text-lg tracking-wide">Bogreaukratiet</span>
    </a>
  </div>
  <nav class="border-t border-border py-3 px-4">
    <div class="max-w-4xl mx-auto flex items-center justify-center gap-8">
      <a class="text-sm uppercase tracking-widest hover:text-accent transition-colors" href="arkiv.html">Arkiv</a>
      <a class="text-sm uppercase tracking-widest text-accent hover:text-accent-dark transition-colors" href="statistik.html">Statistik</a>
      <a class="text-sm uppercase tracking-widest hover:text-accent transition-colors" href="vedtaegter.html">Vedtægter</a>
      <a class="text-sm uppercase tracking-widest hover:text-accent transition-colors" href="galleri.html">Galleri</a>
    </div>
  </nav>
</header>

<main class="max-w-5xl mx-auto px-4 py-12">
  <div class="text-center mb-16">
    <span class="text-xs uppercase tracking-[0.3em] text-accent font-medium">Tallene bag postyret</span>
    <h2 class="text-3xl md:text-4xl mt-2">Statistik</h2>
    <div class="mt-4 flex items-center justify-center gap-2">
      <div class="h-px w-40 bg-border-dark"></div>
    </div>
  </div>

  <!-- All books ranked -->
  <section class="reveal max-w-2xl mx-auto">
    <div class="bg-background-paper border border-border rounded-sm p-6 sm:p-8">
      <h3 class="text-xl mb-1">Alle bøger rangeret</h3>
      <div id="stats" class="flex flex-wrap gap-x-8 gap-y-1 mb-3 empty:hidden"></div>
      <ol id="ranking" aria-live="polite">
        <li class="py-4 text-sm text-foreground-muted italic">Henter bedømmelser…</li>
      </ol>
    </div>
  </section>

  <!-- Hårdeste og mildeste kritiker (udfyldes af scriptet) -->
  <section id="critics" class="reveal max-w-2xl mx-auto"></section>
</main>

<footer class="border-t border-border py-8 mt-12">
  <div class="max-w-5xl mx-auto px-4 text-center">
    <p class="text-xs text-foreground-muted uppercase tracking-widest">Bogreaukratiet</p>
  </div>
</footer>

<script>
  // Bedømmelserne ligger i bedoemmelser.json — ret filen, ikke siden her.
  (async () => {
    const list = document.getElementById('ranking');
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const STAR = '12 2 15 9 22 9 16.5 13.5 18.5 21 12 16.5 5.5 21 7.5 13.5 2 9 9 9';

    const el = (tag, cls, text) => {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined) node.textContent = text;
      return node;
    };

    const svg = (size, cls) => {
      const s = document.createElementNS(SVG_NS, 'svg');
      s.setAttribute('width', size);
      s.setAttribute('height', size);
      s.setAttribute('viewBox', '0 0 24 24');
      s.setAttribute('fill', 'none');
      s.setAttribute('aria-hidden', 'true');
      if (cls) s.setAttribute('class', cls);
      return s;
    };

    const starIcon = (size, filled) => {
      const s = svg(size);
      const p = document.createElementNS(SVG_NS, 'polygon');
      p.setAttribute('points', STAR);
      p.setAttribute('stroke', '#d97706');
      p.setAttribute('stroke-width', '1.5');
      p.setAttribute('stroke-linejoin', 'round');
      p.setAttribute('fill', filled ? '#d97706' : 'none');
      s.appendChild(p);
      return s;
    };

    const chevron = () => {
      const s = svg(16, 'chev flex-shrink-0 self-center text-foreground-muted');
      const p = document.createElementNS(SVG_NS, 'path');
      p.setAttribute('d', 'M6 9l6 6 6-6');
      p.setAttribute('stroke', 'currentColor');
      p.setAttribute('stroke-width', '1.5');
      p.setAttribute('stroke-linecap', 'round');
      p.setAttribute('stroke-linejoin', 'round');
      s.appendChild(p);
      return s;
    };

    const fmt = (n) => n.toLocaleString('da-DK', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

    const summarize = (book) => {
      const ratings = {};
      for (const [name, value] of Object.entries(book.bedoemmelser || {})) {
        const n = Number(value);
        if (Number.isFinite(n) && n >= 1 && n <= 5) ratings[name] = n;
        else console.warn(`Ugyldig bedømmelse for ${book.titel} / ${name}: ${value} (skal være 1–5)`);
      }
      const values = Object.values(ratings);
      const avg = values.length ? values.reduce((a, b) => a + b, 0) / values.length : null;
      return { ...book, ratings, avg, count: values.length };
    };

    const scoreLine = (avg, extra = '') => {
      const line = el('p', `score-num font-heading text-xl flex items-center gap-1.5 ${extra}`);
      line.appendChild(starIcon(15, true));
      const num = el('span', '', fmt(avg));
      num.appendChild(el('span', 'font-body text-sm font-normal text-foreground-muted ml-1', '/ 5'));
      line.appendChild(num);
      return line;
    };

    const memberRatings = (book, members) => {
      const names = [...members, ...Object.keys(book.ratings).filter((n) => !members.includes(n))];
      const ul = el('ul', 'pb-4 pl-11 grid grid-cols-1 sm:grid-cols-2 gap-x-8 gap-y-1');
      for (const name of names) {
        const li = el('li', 'flex items-center justify-between gap-3 py-1');
        li.appendChild(el('span', 'text-sm', name));
        const rating = book.ratings[name];
        if (rating === undefined) {
          const none = el('span', 'text-sm text-foreground-muted', '–');
          none.setAttribute('aria-label', 'ikke bedømt');
          li.appendChild(none);
        } else {
          const stars = el('span', 'flex items-center gap-0.5');
          stars.setAttribute('role', 'img');
          stars.setAttribute('aria-label', `${rating} af 5 stjerner`);
          for (let i = 1; i <= 5; i++) stars.appendChild(starIcon(13, i <= Math.round(rating)));
          li.appendChild(stars);
        }
        ul.appendChild(li);
      }
      return ul;
    };

    const bookRow = (book, rank, members) => {
      const li = el('li', 'border-b border-border last:border-b-0');
      const rated = book.avg !== null;

      const head = el(rated ? 'summary' : 'div',
        'flex items-baseline gap-4 py-4' + (rated
          ? ' cursor-pointer rounded-sm focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent'
          : ''));
      head.appendChild(el('span', 'font-heading text-2xl w-7 flex-shrink-0 ' + (rated ? 'text-accent' : 'text-border-dark'), rated ? String(rank) : '–'));

      const info = el('div', 'min-w-0 flex-1');
      info.appendChild(el('p', 'book-title text-lg leading-snug transition-colors sm:pr-12', book.titel));
      info.appendChild(el('p', 'text-sm text-foreground-muted italic mt-0.5', book.forfatter));
      head.appendChild(info);

      if (!rated) {
        head.appendChild(el('span', 'text-xs text-foreground-muted uppercase tracking-widest flex-shrink-0', 'Ikke bedømt'));
        li.appendChild(head);
        return li;
      }

      const score = el('div', 'text-right flex-shrink-0');
      score.appendChild(scoreLine(book.avg, 'justify-end'));
      const trailing = el('div', 'flex items-center gap-4 flex-shrink-0 self-center');
      trailing.appendChild(score);
      trailing.appendChild(chevron());
      head.appendChild(trailing);

      const details = document.createElement('details');
      details.appendChild(head);
      details.appendChild(memberRatings(book, members));
      li.appendChild(details);
      return li;
    };

    // Antal bøger = bøgerne i filen; sider = summen af hver bogs "sider".
    const renderStats = (books) => {
      const pagesOf = (b) => (Number.isFinite(Number(b.sider)) && Number(b.sider) > 0 ? Number(b.sider) : 0);
      books.filter((b) => !pagesOf(b)).forEach((b) => console.warn(`Mangler sideantal ("sider") for ${b.titel}`));
      const pages = books.reduce((sum, b) => sum + pagesOf(b), 0);

      const note = (value, label) => {
        const p = el('p', 'flex items-baseline gap-1.5');
        p.appendChild(el('span', 'stat-num font-heading text-xl', value.toLocaleString('da-DK')));
        p.appendChild(el('span', 'text-sm text-foreground-muted italic', label));
        return p;
      };
      document.getElementById('stats').replaceChildren(
        note(books.length, books.length === 1 ? 'bog læst' : 'bøger læst'),
        note(pages, 'sider læst'),
      );
    };

    const criticBox = (title, subtitle, critics) => {
      const box = el('div', 'bg-background-paper border border-border rounded-sm p-6 sm:p-8');
      box.appendChild(el('h3', 'text-xl mb-1', title));
      box.appendChild(el('p', 'text-sm text-foreground-muted italic mb-6', subtitle));
      const names = new Intl.ListFormat('da', { style: 'long', type: 'conjunction' }).format(critics.map((c) => c.name));
      const row = el('div', 'flex items-center justify-center gap-8');
      row.appendChild(el('p', 'font-heading text-2xl leading-snug min-w-0', names));
      row.appendChild(scoreLine(critics[0].avg, 'flex-shrink-0 whitespace-nowrap'));
      box.appendChild(row);
      return box;
    };

    // Regnes ud af hvert medlems gennemsnit på tværs af alle bøger. Ved lighed (samme tal med én decimal) står alle med.
    const renderCritics = (books, members) => {
      const totals = new Map();
      for (const book of books) {
        for (const [name, rating] of Object.entries(book.ratings)) {
          const t = totals.get(name) || { sum: 0, count: 0 };
          t.sum += rating;
          t.count += 1;
          totals.set(name, t);
        }
      }
      const critics = members.flatMap((name) => {
        const t = totals.get(name);
        return t ? [{ name, avg: t.sum / t.count, key: Math.round((t.sum / t.count) * 10) }] : [];
      });
      const keys = critics.map((c) => c.key);
      const lowest = Math.min(...keys);
      const highest = Math.max(...keys);
      if (critics.length < 2 || lowest === highest) return;

      const grid = el('div', 'grid gap-6 mt-6 sm:grid-cols-2');
      grid.appendChild(criticBox('Hårdeste kritiker', 'Giver færrest stjerner i gennemsnit', critics.filter((c) => c.key === lowest)));
      grid.appendChild(criticBox('Mildeste kritiker', 'Giver flest stjerner i gennemsnit', critics.filter((c) => c.key === highest)));
      document.getElementById('critics').replaceChildren(grid);
    };

    try {
      const res = await fetch('bedoemmelser.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const members = data.medlemmer || [];
      const books = (data.boeger || []).map(summarize);

      const rated = books.filter((b) => b.avg !== null).sort((a, b) => b.avg - a.avg);
      const unrated = books.filter((b) => b.avg === null);

      list.replaceChildren();
      let rank = 0;
      let prevKey = null;
      rated.forEach((book, i) => {
        const key = Math.round(book.avg * 10);
        if (key !== prevKey) rank = i + 1;
        prevKey = key;
        list.appendChild(bookRow(book, rank, members));
      });
      unrated.forEach((book) => list.appendChild(bookRow(book, null, members)));
      renderStats(books);
      renderCritics(books, members);
    } catch (err) {
      console.error(err);
      list.replaceChildren(el('li', 'py-4 text-sm text-foreground-muted italic', 'Kunne ikke hente bedømmelserne. Tjek at bedoemmelser.json ligger ved siden af statistik.html, og at siden åbnes fra en server (ikke direkte som fil).'));
    }
  })();
</script>
<script>
  const items = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    items.forEach((el) => io.observe(el));
  } else {
    items.forEach((el) => el.classList.add('is-visible'));
  }
</script>
</body>
</html>
